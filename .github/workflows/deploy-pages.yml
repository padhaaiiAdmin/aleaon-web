name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (pre-rendered static site)
        run: npx ng build --configuration=production

      - name: Prepare Pages artifact
        run: |
          SITE=dist/aleaon-web/browser
          # GitHub Pages serves 404.html for unknown URLs — use the site's own 404 page.
          if [ -f "$SITE/404/index.html" ]; then
            cp "$SITE/404/index.html" "$SITE/404.html"
          else
            cp "$SITE/index.html" "$SITE/404.html"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/aleaon-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
