# /etc/nginx/sites-available/aleaon  — serves the prerendered site from /var/www/aleaon
# SSL lines are added by: sudo certbot --nginx -d aleaon.com -d www.aleaon.com

server {
    listen 80;
    server_name www.aleaon.com;
    return 301 https://aleaon.com$request_uri;
}

server {
    listen 80;
    server_name aleaon.com;
    root /var/www/aleaon;
    index index.html;

    # Each page is prerendered to <route>/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404/index.html;

    # Hashed JS/CSS/font files never change: cache for a year
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:png|svg|ico|jpg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
